    html += `</table></div>`;
  }
  $("#home").innerHTML = html;
  show("home");
}
function resetStats(){ if (confirm("Delete all saved best scores and topic stats on this device?")){ localStorage.removeItem(STORE_KEY); renderHome(); } }

/* ================= LEARN ================= */
function renderLearn(focus){
  stopTimer();
  let html = `<div class="topbar"><button class="btn ghost" onclick="renderHome()">← Home</button><h2>Learn: revision notes</h2></div>
  <div class="tabs">${Object.keys(TOPICS).map(t=>`<a href="#learn-${t}" class="tab">T${t}</a>`).join("")}</div>`;
  Object.keys(TOPICS).forEach(t=>{
    const L = LEARN[t];
    html += `<div class="card learn" id="learn-${t}"><h3>Topic ${t}: ${TOPICS[t]}</h3><p class="muted">${L.summary}</p>
      <ul>${L.points.map(p=>`<li>${p}</li>`).join("")}</ul>
      <div class="formula"><b>Formulas</b>${L.formulas.map(f=>`<div>${esc(f)}</div>`).join("")}</div>
      <div class="row-end"><button class="btn small" onclick="quickTopic(${t})">Practise Topic ${t} (10 mixed questions)</button></div></div>`;
  });
  $("#learn").innerHTML = html; show("learn");
  if (focus){ const el = document.getElementById("learn-"+focus); if (el) el.scrollIntoView(); }
}
function quickTopic(t){ startSession("mixed", [t], 10, true, false); }

/* ================= SETUP ================= */
function openSetup(sec){
  stopTimer();
  const isExam = sec === "exam";
  const poolSize = {tf:POOLS.tf.length, match:POOLS.match.length, mcq:POOLS.mcq.length, adv:POOLS.adv.length, mixed:ALL.length}[sec];
  let html = `<div class="topbar"><button class="btn ghost" onclick="renderHome()">← Home</button><h2>${SECTIONS[sec].icon} ${SECTIONS[sec].name}</h2></div><div class="card">
  <p>${SECTIONS[sec].desc}</p>`;
  if (isExam){
    html += `<ul class="rules"><li>15 single-answer multiple-choice questions drawn at random from ${SINGLE_POOL.length}, at least 2 from every topic.</li>
      <li>30:00 countdown, always visible. The test <b>auto-submits at 0:00</b>.</li>
      <li>You can move between questions and flag them for review before submitting.</li>
      <li>No explanations until you submit, just like the real thing. Use paper and a calculator.</li></ul>
      <label class="chk"><input type="checkbox" id="extra"> Study Inclusion Plan: +25% extra time (37:30)</label>`;
  } else {
    html += `<div class="field"><b>Topics</b><div class="chips">${Object.keys(TOPICS).map(t=>`<label class="chip"><input type="checkbox" class="tp" value="${t}" checked> T${t} ${TOPICS[t]}</label>`).join("")}</div></div>
    <div class="field"><b>Number of ${sec==="match"?"sets":"questions"}</b><div class="chips">${(sec==="match"?[5,8,12,"All"]:[10,15,20,30,"All"]).map((n,i)=>`<label class="chip"><input type="radio" name="num" value="${n}" ${i===(sec==="match"?0:1)?"checked":""}> ${n==="All"?"All ("+poolSize+")":n}</label>`).join("")}</div></div>
    <label class="chk"><input type="checkbox" id="timed" checked> Timed (≈${Math.round(SECTIONS[sec].per/60*10)/10} min per ${sec==="match"?"set":"question"}, auto-submit at zero)</label>`;
  }
  html += `<div class="row-end"><button class="btn primary big" onclick="beginFromSetup('${sec}')">Start</button></div></div>`;
  $("#setup").innerHTML = html; show("setup");
}
function beginFromSetup(sec){
  if (sec === "exam"){ startSession("exam", [1,2,3,4,5,6], 15, true, $("#extra").checked); return; }
  const topics = Array.from(document.querySelectorAll(".tp:checked")).map(x=>+x.value);
  if (!topics.length){ alert("Pick at least one topic."); return; }
  const nv = document.querySelector("input[name=num]:checked").value;
  startSession(sec, topics, nv==="All"?9999:+nv, $("#timed").checked, false);
}

/* ================= SESSION ================= */
function startSession(sec, topics, n, timed, extra, fixedList){
  let qs;
  if (fixedList) qs = fixedList;
  else if (sec === "exam") qs = pick(SINGLE_POOL, 15, topics, 2);
  else if (sec === "mixed") qs = pick(ALL, n, topics, topics.length>1?1:0);
  else qs = pick(POOLS[sec], n, topics, 0);
  if (!qs.length){ alert("No questions for that selection."); return; }
  qs = qs.map(prep);
  let secs = 0;
  if (sec === "exam") secs = extra ? 37.5*60 : 30*60;
  else if (timed) secs = qs.reduce((s,q)=>s + (q.kind==="match"?180:q.kind==="tf"?60:SECTIONS[sec==="mixed"?"mcq":sec].per), 0);
  S = {sec, topics, qs, ans:{}, flag:{}, i:0, timed: sec==="exam"||timed, total:secs, left:secs, started:Date.now(), extra, submitted:false};
  renderQuiz();
  if (S.timed) startTimer();
}

function startTimer(){
  stopTimer();
  const end = Date.now() + S.left*1000;
  timerHandle = setInterval(()=>{
    S.left = Math.max(0, Math.round((end - Date.now())/1000));
    updateTimer();
    if (S.left <= 0){ stopTimer(); submit(true); }
  }, 250);
  updateTimer();
}
function stopTimer(){ if (timerHandle){ clearInterval(timerHandle); timerHandle = null; } }
function fmt(s){ const m = Math.floor(s/60), r = s%60; return m+":"+String(r).padStart(2,"0"); }
function updateTimer(){
  const el = $("#timer"); if (!el || !S) return;
  el.textContent = "⏱ " + fmt(S.left);
  el.classList.toggle("warn", S.left <= 300 && S.left > 60);
  el.classList.toggle("crit", S.left <= 60);
  const bar = $("#tbar"); if (bar) bar.style.width = (100*S.left/S.total)+"%";
}

function answered(q){
  const a = S.ans[q.uid];
  if (a === undefined || a === null) return false;
  if (q.kind === "multi") return a.length > 0;
  if (q.kind === "match") return Object.values(a).some(v=>v);
  return true;
}

function renderQuiz(){
  const q = S.qs[S.i];
  const nAns = S.qs.filter(answered).length;
  let html = `<div class="quiz-head"><div class="qh-left"><button class="btn ghost small" onclick="quitQuiz()">✕ Quit</button><span class="qh-title">${SECTIONS[S.sec].name}</span></div>
    ${S.timed?`<div id="timer" class="timer">⏱ ${fmt(S.left)}</div>`:`<div class="timer off">Untimed</div>`}</div>
    ${S.timed?`<div class="tbar"><div id="tbar"></div></div>`:""}
    <div class="nav">${S.qs.map((x,k)=>`<button class="nb ${k===S.i?"cur":""} ${answered(x)?"done":""} ${S.flag[x.uid]?"flag":""}" onclick="go(${k})" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
    <div class="card qcard">
      <div class="qmeta"><span class="pill">Q${S.i+1} of ${S.qs.length}</span><span class="pill muted">T${q.t} · ${TOPICS[q.t]}</span><span class="pill gold">${esc(q.sub)}</span></div>`;
  html += renderQuestionBody(q);
  html += `</div><div class="qfoot">
      <button class="btn" onclick="go(${S.i-1})" ${S.i===0?"disabled":""}>← Prev</button>
      <button class="btn ghost" onclick="toggleFlag()">${S.flag[q.uid]?"⚑ Unflag":"⚐ Flag"}</button>
      ${S.i<S.qs.length-1?`<button class="btn primary" onclick="go(${S.i+1})">Next →</button>`:`<button class="btn primary" onclick="confirmSubmit()">Submit</button>`}
    </div>
    <div class="row-end"><span class="small">${nAns}/${S.qs.length} answered</span> <button class="btn danger" id="submitBtn" onclick="confirmSubmit()">Submit ${S.sec==="exam"?"test":"answers"}</button></div>`;
  $("#quiz").innerHTML = html; show("quiz"); updateTimer();
}

function renderQuestionBody(q){
  const a = S.ans[q.uid];
  let h = "";
  if (q.ar){
    h += `<div class="qtext">Read the assertion and the reason, then choose the correct option.</div>
      <div class="ar"><div><b>Assertion (A):</b> ${esc(q.ar.A)}</div><div><b>Reason (R):</b> ${esc(q.ar.R)}</div></div>`;
  } else h += `<div class="qtext">${esc(q.q)}</div>`;
  if (q.kind === "single" || q.kind === "tf"){
    h += `<div class="opts">` + q.opts.map((o,k)=>`<label class="opt ${a===k?"sel":""}"><input type="radio" name="o" ${a===k?"checked":""} onchange="setAns(${k})"><span class="let">${q.kind==="tf"?(k===0?"T":"F"):LETTERS[k]}</span><span>${esc(o.text)}</span></label>`).join("") + `</div>`;
  } else if (q.kind === "multi"){
    const arr = a || [];
    h += `<div class="hint">Select every correct option. You score only if your selection is exactly right.</div><div class="opts">` + q.opts.map((o,k)=>`<label class="opt ${arr.includes(k)?"sel":""}"><input type="checkbox" ${arr.includes(k)?"checked":""} onchange="toggleMulti(${k})"><span class="let">${LETTERS[k]}</span><span>${esc(o.text)}</span></label>`).join("") + `</div>`;
  } else if (q.kind === "match"){
    const m = a || {};
    h += `<div class="hint">Choose a match for every row. Options can be used more than once, and some are not used at all.</div><div class="match">` + q.rows.map((r,k)=>`<div class="mrow"><div class="mleft">${esc(r.left)}</div><select onchange="setMatch(${k}, this.value)"><option value="">— choose —</option>${q.choices.map(c=>`<option ${m[k]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`).join("") + `</div>`;
  }
  return h;
}
function cur(){ return S.qs[S.i]; }
function setAns(k){ S.ans[cur().uid] = k; renderQuiz(); }
function toggleMulti(k){ const q = cur(); const arr = (S.ans[q.uid]||[]).slice(); const i = arr.indexOf(k); if (i>=0) arr.splice(i,1); else arr.push(k); S.ans[q.uid] = arr; renderQuiz(); }
function setMatch(k, v){ const q = cur(); const m = Object.assign({}, S.ans[q.uid]||{}); m[k] = v; S.ans[q.uid] = m; refreshNav(); }
function refreshNav(){ document.querySelectorAll(".nb").forEach((b,k)=>b.classList.toggle("done", answered(S.qs[k]))); }
function toggleFlag(){ const q = cur(); S.flag[q.uid] = !S.flag[q.uid]; renderQuiz(); }
function go(k){ if (k<0 || k>=S.qs.length) return; S.i = k; renderQuiz(); }
function quitQuiz(){ if (confirm("Quit this attempt? Your answers will not be marked.")){ stopTimer(); S=null; renderHome(); } }
function confirmSubmit(){
  const un = S.qs.filter(q=>!answered(q)).length, fl = Object.values(S.flag).filter(Boolean).length;
  let msg = "Submit now?";
  if (un) msg = `You have ${un} unanswered question${un>1?"s":""}` + (fl?` and ${fl} flagged`:"") + ". Submit anyway?";
  else if (fl) msg = `You have ${fl} flagged question${fl>1?"s":""}. Submit anyway?`;
  if (confirm(msg)) submit(false);
}

/* ================= MARKING ================= */
function mark(q){
  const a = S.ans[q.uid];
  if (q.kind === "single" || q.kind === "tf") return a !== undefined && q.opts[a] && q.opts[a].correct;
  if (q.kind === "multi"){ const arr = a||[]; return q.opts.every((o,k)=>o.correct === arr.includes(k)); }
  if (q.kind === "match"){ const m = a||{}; return q.rows.every((r,k)=>m[k]===r.answer); }
  return false;
}

function submit(auto){
  if (!S || S.submitted) return;
  S.submitted = true; stopTimer();
  S.used = S.total ? S.total - S.left : Math.round((Date.now()-S.started)/1000);
  S.auto = auto;
  S.res = S.qs.map(q=>({q, ok: mark(q)}));
  const c = S.res.filter(r=>r.ok).length, n = S.res.length, pct = Math.round(100*c/n);
  // save stats
  const st = loadStore();
  const b = st.best[S.sec] || {best:0, attempts:0};
  b.attempts++; b.best = Math.max(b.best, pct); b.last = pct; st.best[S.sec] = b;
  S.res.forEach(r=>{ const d = st.topic[r.q.t] || {c:0,n:0}; d.n++; if (r.ok) d.c++; st.topic[r.q.t] = d; });
  const now = new Date();
  st.history.push({when: now.toLocaleDateString("en-GB")+" "+now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}), sec:S.sec, c, n, pct});
  if (st.history.length > 50) st.history = st.history.slice(-50);
  saveStore(st);
  S.score = {c, n, pct, newBest: pct >= b.best && b.attempts>1 ? pct===b.best : false};
  renderResults("all");
}

function answerText(q){
  const a = S.ans[q.uid];
  if (q.kind === "single" || q.kind === "tf") return a === undefined ? "<i>No answer</i>" : `${q.kind==="tf"?"":LETTERS[a]+". "}${esc(q.opts[a].text)}`;
  if (q.kind === "multi"){ const arr = (a||[]).slice().sort(); return arr.length ? arr.map(k=>LETTERS[k]+". "+esc(q.opts[k].text)).join("<br>") : "<i>No answer</i>"; }
  return "";
}
function correctText(q){
  if (q.kind === "single" || q.kind === "tf"){ const k = q.opts.findIndex(o=>o.correct); return `${q.kind==="tf"?"":LETTERS[k]+". "}${esc(q.opts[k].text)}`; }
  if (q.kind === "multi") return q.opts.map((o,k)=>o.correct?LETTERS[k]+". "+esc(o.text):null).filter(Boolean).join("<br>");
  return "";
}

function renderResults(filter){
  const {c, n, pct} = S.score;
  const grade = pct>=70?"ok":pct>=50?"mid":"bad";
  const msg = pct>=85?"Excellent: exam-ready on this material.":pct>=70?"Good. Tighten up the weak topics below.":pct>=50?"Borderline. Work through the explanations and the topic lessons below.":"Needs work. Read every explanation, then use the Learn notes for your weak topics.";
  let html = `<div class="topbar"><button class="btn ghost" onclick="renderHome()">← Home</button><h2>Results: ${SECTIONS[S.sec].name}</h2></div>
  <div class="card score ${grade}"><div class="big-score">${c}/${n}<span>${pct}%</span></div><div><p><b>${msg}</b></p>
    <p class="small">${S.auto?"⏰ Time ran out, so the test was auto-submitted. ":""}Time used: ${fmt(S.used)}${S.total?` of ${fmt(S.total)}`:""}${S.sec==="exam"&&S.extra?" (extra time)":""}.</p>
    ${S.sec==="exam"?`<p class="small">In the real test each question is worth 2% of your module grade, so this would be about <b>${(c*2)}%</b> of the 30%.</p>`:""}</div></div>`;
  // by topic
  const by = {};
  S.res.forEach(r=>{ const d = by[r.q.t] || (by[r.q.t] = {c:0,n:0}); d.n++; if (r.ok) d.c++; });
  html += `<h2>Score by topic</h2><div class="card">`;
  Object.keys(by).sort().forEach(t=>{ const d = by[t], p = Math.round(100*d.c/d.n);
    html += `<div class="bar-row"><div class="bar-lbl">T${t} · ${TOPICS[t]}</div><div class="bar"><div class="fill ${p>=70?"ok":p>=50?"mid":"bad"}" style="width:${p}%"></div></div><div class="bar-val">${d.c}/${d.n}</div></div>`; });
  html += `</div>`;
  // weak topics mini lessons
  const weak = Object.keys(by).filter(t=>by[t].c/by[t].n < 0.7);
  if (weak.length){
    html += `<h2>Review these topics</h2>`;
    weak.forEach(t=>{
      const L = LEARN[t];
      const missed = S.res.filter(r=>!r.ok && r.q.t==t).map(r=>r.q.sub);
      html += `<div class="card lesson"><h3>📌 Topic ${t}: ${TOPICS[t]} <span class="pill bad">${by[t].c}/${by[t].n}</span></h3>
        <p class="small">You missed: ${esc(Array.from(new Set(missed)).join(", "))}</p>
        <b>Key points to fix</b><ul>${L.points.map(p=>`<li>${p}</li>`).join("")}</ul>
        <div class="formula"><b>Formulas</b>${L.formulas.map(f=>`<div>${esc(f)}</div>`).join("")}</div>
        <div class="row-end"><button class="btn small" onclick="quickTopic(${t})">Drill Topic ${t} now</button></div></div>`;
    });
  } else html += `<div class="card ok-note">✅ No weak topics in this attempt (every topic was at least 70%).</div>`;
  // actions
  const wrong = S.res.filter(r=>!r.ok).map(r=>POOLS_LOOKUP[r.q.uid]);
  html += `<div class="actions">${wrong.length?`<button class="btn primary" onclick="retryWrong()">↻ Retry the ${wrong.length} I got wrong</button>`:""}
    <button class="btn" onclick="${S.sec==="exam"?"openSetup('exam')":`openSetup('${S.sec}')`}">New attempt</button>
    <button class="btn ghost" onclick="renderLearn()">📘 Learn notes</button></div>`;
  // review
  html += `<h2>Answer review</h2><div class="tabs"><button class="tab ${filter==="all"?"on":""}" onclick="renderResults('all')">All (${n})</button><button class="tab ${filter==="wrong"?"on":""}" onclick="renderResults('wrong')">Wrong (${n-c})</button><button class="tab ${filter==="right"?"on":""}" onclick="renderResults('right')">Right (${c})</button></div>`;
  S.res.forEach((r,k)=>{
    if (filter==="wrong" && r.ok) return; if (filter==="right" && !r.ok) return;
    html += reviewCard(r, k);
  });
  $("#results").innerHTML = html; show("results");
}

function reviewCard(r, k){
  const q = r.q, a = S.ans[q.uid];
  let h = `<div class="card rev ${r.ok?"r-ok":"r-bad"}"><div class="qmeta"><span class="pill ${r.ok?"okp":"bad"}">${r.ok?"✔ Correct":"✘ "+(answered(q)?"Wrong":"Not answered")}</span><span class="pill">Q${k+1}</span><span class="pill muted">T${q.t} · ${TOPICS[q.t]}</span><span class="pill gold">${esc(q.sub)}</span></div>`;
  if (q.ar) h += `<div class="ar"><div><b>A:</b> ${esc(q.ar.A)}</div><div><b>R:</b> ${esc(q.ar.R)}</div></div>`;
  else h += `<div class="qtext">${esc(q.q)}</div>`;
  if (q.kind === "single" || q.kind === "tf"){
    h += `<div class="ans"><div><b>Your answer:</b> ${answerText(q)}</div><div><b>Correct answer:</b> ${correctText(q)}</div></div>`;
    if (q.kind === "single"){
      h += `<div class="why-list">` + q.opts.map((o,j)=>`<div class="why ${o.correct?"w-ok":""} ${a===j&&!o.correct?"w-bad":""}"><span class="let">${LETTERS[j]}</span><div><b>${esc(o.text)}</b>${a===j?' <span class="pill tiny">your choice</span>':""}<div class="small">${esc(o.why)}</div></div></div>`).join("") + `</div>`;
    } else if (!r.ok && q.trap){ h += `<div class="trap">⚠️ ${esc(q.trap)}</div>`; }
  } else if (q.kind === "multi"){
    const arr = a || [];
    h += `<div class="why-list">` + q.opts.map((o,j)=>{ const picked = arr.includes(j); const right = o.correct===picked;
      return `<div class="why ${o.correct?"w-ok":""} ${!right?"w-bad":""}"><span class="let">${o.correct?"✔":"✘"}</span><div><b>${esc(o.text)}</b> ${picked?'<span class="pill tiny">you selected</span>':""} ${!right?(o.correct?'<span class="pill tiny bad">missed</span>':'<span class="pill tiny bad">should NOT be selected</span>'):""}<div class="small">${esc(o.why)}</div></div></div>`; }).join("") + `</div>`;
  } else if (q.kind === "match"){
    const m = a || {}; let good = 0;
    h += `<table class="tbl mt"><tr><th>Item</th><th>Your match</th><th>Correct match</th></tr>` + q.rows.map((row,j)=>{ const ok = m[j]===row.answer; if (ok) good++;
      return `<tr class="${ok?"t-ok":"t-bad"}"><td>${esc(row.left)}</td><td>${m[j]?esc(m[j]):"<i>blank</i>"} ${ok?"✔":"✘"}</td><td>${esc(row.answer)}</td></tr>`; }).join("") + `</table><div class="small">${good}/${q.rows.length} rows correct (the set scores only if every row is right).</div>`;
  }
  h += `<div class="exp"><b>Why:</b> ${esc(q.exp)}</div>`;
  if (q.steps) h += `<div class="steps"><b>Worked solution</b><ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
  h += `<div class="row-end"><button class="btn ghost small" onclick="renderLearn(${q.t})">📘 Revise Topic ${q.t}</button></div></div>`;
  return h;
}

const POOLS_LOOKUP = {}; ALL.forEach(q=>POOLS_LOOKUP[q.uid] = q);
function retryWrong(){
  const list = S.res.filter(r=>!r.ok).map(r=>POOLS_LOOKUP[r.q.uid]);
  const sec = S.sec === "exam" ? "mixed" : S.sec;
  startSession(sec, [1,2,3,4,5,6], list.length, S.timed, false, shuffle(list));
}

window.addEventListener("beforeunload", e=>{ if (S && !S.submitted){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("DOMContentLoaded", renderHome);

</script>
</body>
</html>
