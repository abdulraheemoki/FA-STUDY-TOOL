<title>Financial Accounting Study Tool (FIM4002, Topics 1–6)</title>
<style>
:root{--bg:#F3F0E8;--bg2:#E8E3D6;--ink:#1A2422;--muted:#4A5A57;--card:#FFFCF6;--accent:#0D4A43;--accent2:#15685E;--soft:#D7EBE7;--gold:#6E5210;--goldsoft:#F3E6C4;--ok:#0C5A38;--okbg:#D8F0E4;--bad:#8A1C1C;--badbg:#F8DDDD;--mid:#9A6A00;--line:#D0CBBE;--shadow:0 1px 3px rgba(26,36,34,.08),0 8px 24px rgba(26,36,34,.06);--r:14px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
h1{margin:0 0 6px;font-size:1.7rem}h1 span{font-size:.9rem;background:var(--goldsoft);color:var(--gold);padding:2px 8px;border-radius:8px;vertical-align:middle}
h2{font-size:1.15rem;margin:26px 0 10px}h3{margin:6px 0 6px;font-size:1.05rem}
.small{font-size:.86rem;color:var(--muted)}.muted{color:var(--muted)}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.hero p{margin:4px 0;opacity:.95}.hero .small{color:#e8f3f1}
.hero .btn.primary{background:#fff;color:var(--accent);border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sec{cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column}
.sec:hover,.sec:focus{transform:translateY(-2px);outline:2px solid var(--soft)}
.sec p{flex:1;margin:4px 0 10px;color:var(--muted);font-size:.93rem}
.sec-ico{font-size:1.6rem}.sec-foot{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600;margin-right:4px}
.pill.gold{background:var(--goldsoft);color:var(--gold)}.pill.muted{background:var(--bg2);color:var(--muted)}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.okp{background:var(--okbg);color:var(--ok)}.pill.tiny{font-size:.7rem;padding:0 6px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--bg2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.danger:hover{background:var(--badbg)}
.btn.big{padding:12px 22px;font-size:1.05rem}.btn.small{padding:5px 11px;font-size:.85rem}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}.topbar h2{margin:0}
.row-end{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

.bar-lbl{font-size:.9rem}.bar{height:12px;background:var(--bg2);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--muted)}.fill.ok{background:var(--ok)}.fill.mid{background:#C58B00}.fill.bad{background:var(--bad)}
.bar-val{text-align:right;font-weight:600;font-size:.9rem}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.t-ok td{background:var(--okbg)}.t-bad td{background:var(--badbg)}.mt{margin-top:10px}
.field{margin:12px 0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff;cursor:pointer;font-size:.9rem}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.rules li{margin:4px 0}
.quiz-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.qh-left{display:flex;align-items:center;gap:8px}.qh-title{font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;background:var(--accent);color:#fff;padding:6px 14px;border-radius:10px}
.timer.off{background:var(--bg2);color:var(--muted);font-size:.9rem}.timer.warn{background:#C58B00}.timer.crit{background:var(--bad);animation:pulse 1s infinite}

.tbar{height:5px;background:var(--bg2);border-radius:3px;margin-bottom:10px;overflow:hidden}.tbar div{height:100%;background:var(--accent2);transition:width .25s linear}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.nb{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--ink)}
.nb.done{background:var(--soft);border-color:var(--accent2)}.nb.cur{outline:3px solid var(--accent);outline-offset:1px}.nb.flag{border-color:#C58B00;box-shadow:inset 0 -4px 0 #C58B00}
.qmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.qtext{font-size:1.08rem;font-weight:600;margin-bottom:12px;white-space:pre-line}
.ar{background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:12px}.ar div{margin:4px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--accent2)}.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt input{margin-top:4px}
.let{flex:0 0 26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.hint{font-size:.86rem;color:var(--gold);background:var(--goldsoft);padding:6px 10px;border-radius:8px;margin-bottom:10px}
.match{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.mleft{font-weight:600}.mrow select{font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;width:100%}
.qfoot{display:flex;justify-content:space-between;gap:8px}
.score{display:flex;gap:20px;align-items:center}.score.ok{border-left:6px solid var(--ok)}.score.mid{border-left:6px solid #C58B00}.score.bad{border-left:6px solid var(--bad)}
.big-score{font-size:2.4rem;font-weight:800;line-height:1;text-align:center;min-width:120px}.big-score span{display:block;font-size:1.1rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rev.r-ok{border-left:5px solid var(--ok)}.rev.r-bad{border-left:5px solid var(--bad)}
.ans{background:var(--bg2);border-radius:10px;padding:8px 12px;margin:6px 0 10px}.ans div{margin:3px 0}
.why-list{display:flex;flex-direction:column;gap:6px}
.why{display:flex;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.why.w-ok{background:var(--okbg);border-color:#9fd3b8}.why.w-bad{background:var(--badbg);border-color:#e7a9a9}
.why .small{color:var(--ink);opacity:.85}
.exp{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:10px}
.trap{margin-top:8px;padding:8px 12px;background:var(--goldsoft);border-radius:10px;color:var(--gold)}
.steps{margin-top:10px;padding:10px 12px;background:#fff;border:1px dashed var(--accent2);border-radius:10px}.steps ol{margin:6px 0 0 0;padding-left:22px}.steps li{font-variant-numeric:tabular-nums}
.learn ul,.lesson ul{padding-left:20px}.learn li,.lesson li{margin:6px 0}
.formula{background:var(--goldsoft);border-radius:10px;padding:10px 14px;margin-top:8px;font-variant-numeric:tabular-nums}.formula div{margin:3px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.ok-note{background:var(--okbg)}
footer{margin-top:30px;text-align:center}
@media (max-width:640px){
 .hero{flex-direction:column;align-items:flex-start}.bar-row{grid-template-columns:1fr 60px}.bar-lbl{grid-column:1/3}
 .mrow{grid-template-columns:1fr}.score{flex-direction:column;align-items:flex-start}.qfoot .btn{flex:1}
 h1{font-size:1.35rem}.timer{font-size:1.05rem}
}

<div class="wrap">
  <div id="home" class="view"></div>
  <div id="learn" class="view hidden"></div>

  <div id="results" class="view hidden"></div>
  <footer class="small">Built from the FIM4002 Weeks 1–6 flashcards. Works offline. Scores are saved only in this browser.</footer>

<script>
const TOPICS = {
  1: "Basics of Accounting",
  2: "Accounting Equation",
  3: "Conceptual Framework",
  4: "Structure of Financial Statements",
  5: "Non-Current Assets & Depreciation",
  6: "Current Assets"
};

const LEARN = {
  1: {
    summary: "What accounting is, who uses it, the five elements, profit and capital, and the three business types.",
    points: [
      "<b>Accounting</b> = identifying, measuring and communicating financial information so users can make decisions. <b>Bookkeeping</b> is only the recording part. Auditing is a separate job that checks the accounts.",
      "<b>Financial accounting</b>: for outsiders, required by law, follows GAAP/IFRS, whole business, mostly historical, annual. <b>Management accounting</b>: for managers, not required by law, no strict rules, can focus on one product or department, can look ahead, produced whenever needed.",
      "The <b>Conceptual Framework</b> matters most for external reporting, because outsiders cannot ask for tailored reports.",
      "<b>Five elements</b>: assets (owned), liabilities (owed), equity/capital (owner's share), revenue (earned), expenses (costs of running the business). Current = within 1 year; non-current = more than 1 year.",
      "<b>Tricky items</b>: drawings are NOT an expense, they reduce capital. Bad debt written off = expense. Bad debt recovered = revenue. Commission received = revenue. Prepaid rent = current asset. Sales returns/discounts reduce Sales; purchase returns/discounts reduce Purchases (contra items). A loan is a liability; only the <i>interest</i> is an expense.",
      "<b>Sole trader</b>: one owner, unlimited liability (personal assets at risk). Accounts used by HMRC, the bank and potential buyers.",
      "<b>Partnership</b>: 2+ owners, agreement need not be written, <b>joint and several liability</b>: each partner can be made to pay ALL the debts.",
      "<b>Limited company</b>: limited liability (lose only what you put in). Ltd cannot sell shares to the public; plc can. BOTH must file accounts publicly (Registrar of Companies). Shareholders appoint directors to run it.",
      "<b>Users</b>: investors (return: buy/hold/sell), lenders (risk of non-repayment), suppliers (will we be paid?), employees (pay, job security), customers (continued supply), government (tax, statistics), public (local/environmental impact).",
      "<b>General-purpose</b> statements serve many users at once; primary users are <b>owners and long-term lenders</b>."
    ],
    formulas: [
      "Equity = Assets − Liabilities",
      "Net sales = Sales − Sales returns − Sales discounts",
      "Profit = Revenue − Expenses (drawings never reduce profit)",
      "Closing capital = Opening capital + Capital introduced + Profit (− Loss) − Drawings"
    ]
  },
  2: {
    summary: "The accounting equation, definitions of assets and liabilities, recognition, measurement, changes in ownership interest and debit/credit rules.",
    points: [
      "<b>Assets = Liabilities + Ownership interest</b>. Every transaction changes at least two items, so it always balances.",
      "<b>Asset</b>: controlled now, from a past event, could bring future benefit. Three tests: benefit? control? past event? Cash, receivables, land, raw materials, shares in other companies pass. Workforce, an advertising campaign or the owner's personal car fail.",
      "<b>Liability</b>: a present obligation (legal or from normal practice), from a past event, to give up resources. A <b>contingent liability</b> (e.g. a possible lawsuit that may never happen) is NOT recognised. It is disclosed in the notes (prudence).",
      "<b>Recognition</b>: meets the definition, is relevant and a faithful representation, and benefit exceeds cost. Uncertain benefit means it is not recognised.",
      "<b>Historical cost</b> = price on the day of the deal. <b>Fair value</b> = price received to sell in an orderly transaction between market participants at the measurement date.",
      "<b>Ownership interest = net assets</b> (a residual; it depends on how assets and liabilities are measured).",
      "Ownership interest only changes through <b>trading</b> (revenue up, expenses down) or the <b>owner</b> (capital in up, drawings down).",
      "Transaction effects: owner puts in cash (A↑ OI↑); owner gives a truck (A↑ OI↑); loan received (A↑ L↑); loan repaid (A↓ L↓); buy equipment for cash (one asset up, one down, no change in total); buy on credit (A↑ L↑); pay supplier (A↓ L↓); bill a client (receivable↑, OI↑ revenue); collect cash later (cash↑, receivable↓, no change in total).",
      "<b>Debit/credit</b>: Assets up = DEBIT, down = credit. Liabilities and OI up = CREDIT, down = debit. Expenses and drawings are debits; revenue and capital introduced are credits."
    ],
    formulas: [
      "A = L + OI   |   OI = A − L   |   L = A − OI",
      "Closing net assets = Opening OI + Capital in − Drawings + Revenue − Expenses",
      "Change in net assets = Change in ownership interest"
    ]
  },
  3: {
    summary: "The IASB Conceptual Framework: objective, underlying assumptions, qualitative characteristics, constraints and measurement bases (including present value).",
    points: [
      "The Framework is <b>NOT an accounting standard</b>. It sets the concepts that guide the IASB in writing IFRS, and it helps choose a policy when no IFRS applies. The 2018 version covers the objective, qualitative characteristics, reporting entity, elements, recognition/derecognition, measurement, presentation and capital maintenance.",
      "<b>Objective</b>: information on financial position (SOFP), performance (statement of comprehensive income) and changes in financial position (statement of cash flows) for a wide range of users.",
      "<b>Two underlying assumptions</b> (NOT qualitative characteristics): <b>accrual basis</b> (record when the transaction happens, not when cash moves) and <b>going concern</b> (the business will continue for the foreseeable future). If it is not a going concern: realisable (break-up) value, long-term items become current, extra costs like redundancy are recognised.",
      "<b>Four qualitative characteristics</b> (lecture): understandability, relevance, comparability and reliability. Profitability, prudence and neutrality are NOT among the four.",
      "<b>Reliability has 5 parts</b>: faithful representation, substance over form, neutrality, prudence and completeness.",
      "<b>Understandability</b>: users have reasonable knowledge and study with reasonable diligence. Do not exclude relevant information just because it is hard.",
      "<b>Relevance</b>: helps evaluate past, present or future events (<b>predictive value</b>) or confirm past judgements. Affected by nature and <b>materiality</b> (omission/misstatement could change decisions; mainly size, but nature matters, e.g. fraud).",
      "<b>Comparability</b>: comparatives, consistent policies, disclosure of policies and of changes (with the reason and effect).",
      "<b>Substance over form</b>: Sara's oven sale-and-leaseback is, in substance, a loan secured on the oven, so no £5,000 profit is recognised.",
      "<b>Neutrality</b> = free from bias (not prepared to reach a chosen result). <b>Prudence</b> = caution: do not overstate assets/income or understate liabilities/expenses. They can CONFLICT.",
      "<b>Completeness</b> (within materiality and cost): omitting material information reduces BOTH reliability and relevance.",
      "<b>Constraints</b>: timeliness (reporting early using estimates gains relevance and loses reliability) and cost vs benefit.",
      "<b>Four measurement bases</b>: historical cost (past), current cost (replace today), realisable value (sell today), present value (future cash discounted). The most relevant measure is not always the most reliable."
    ],
    formulas: [
      "PV = Future cash ÷ (1 + r)ⁿ",
      "1 year at 10%: ÷ 1.10 | 2 years: ÷ 1.21 | 3 years: ÷ 1.331",
      "Discounting is NOT 'take r% off' (£11,000 in 1 year at 10% = £10,000, not £9,900)"
    ]
  },
  4: {
    summary: "The three primary statements, SOFP structure, income statement, cash-flow classification, double entry, journals, ledgers, trial balance, COGS and depreciation entries.",
    points: [
      "<b>SOFP</b> = financial position (snapshot on ONE date). <b>Income statement</b> = performance (over a PERIOD). <b>Statement of cash flows</b> = financial <b>adaptability</b>. Notes are not one of the three.",
      "<b>Flow</b>: transactions and events → bookkeeping → accounting records → rules of measurement and disclosure → financial statements.",
      "<b>SOFP</b>: NCA + CA − CL − NCL = opening capital ± capital in/out + profit. Liabilities due within 1 year are current; after 1 year, non-current. Horizontal or vertical layout.",
      "<b>Cash flows</b>: operating (day-to-day trading: customers, suppliers, wages), investing (buying/selling non-current assets), financing (shares, raising/repaying loans).",
      "<b>Profit ≠ cash</b>: credit sales/purchases, cash tied up in inventory, cash spent on non-current assets and loan repayments, cash raised from shares/borrowing.",
      "<b>Journal</b> = the first record in date order. <b>Ledger</b> = entries grouped by account (Date, Particulars, Page, Debit, Credit, Balance). Debit balance positive; credit balance in (brackets).",
      "<b>Returns</b>: goods back TO a supplier: Dr Trade payables, Cr Purchases returns. Goods back FROM a customer: Dr Sales returns, Cr Trade receivables.",
      "Credit purchase of goods: Dr Purchases, Cr Trade payables. Owner deposits capital: Dr Bank, Cr Capital. Rent paid: Dr Rent expense, Cr Bank.",
      "<b>Trial balance</b>: a list of ledger balances. Debit side: assets, expenses, drawings. Credit side: liabilities, capital, revenue. It is NOT a financial statement and does NOT prove every entry is correct.",
      "<b>COGS</b>: when goods are sold, Dr Cost of goods sold, Cr Inventory (at COST, not selling price).",
      "<b>Depreciation entry</b>: Dr Depreciation expense, Cr Accumulated depreciation. No cash leaves. Net amount = cost − accumulated depreciation."
    ],
    formulas: [
      "Profit = Revenue − COGS − Other expenses",
      "Change in cash = Net operating + Net investing + Net financing",
      "Inventory = Purchases (at cost) − Cost of goods sold",
      "NBV = Cost − Accumulated depreciation"
    ]
  },
  5: {
    summary: "Non-current assets, cost, capital vs revenue expenditure, depreciation methods, year-end adjustments (accruals, prepayments, bad debts, drawings), cost of sales and company vs sole trader P&L.",
    points: [
      "<b>NCA</b>: held for continuing use to help make profit, not sold in normal trading. Tangible (PPE), intangible (patents, trademarks, development costs, goodwill) and long-term investments.",
      "<b>Cost</b> = purchase price + costs of getting it ready to use (legal fees, installation, commissioning). Running costs are expenses.",
      "<b>Improvement</b> (longer life, cheaper running, better output, e.g. an extension) = capital expenditure, added to cost. <b>Repair</b> back to original condition (storm-damaged roof, replacement bus engine) = revenue expenditure, an expense in P&L.",
      "<b>Depreciation</b> spreads cost over useful life to match revenue. It is NOT market value and does NOT save cash. Yearly charge goes to P&L; accumulated depreciation sits in the SOFP.",
      "Three inputs: cost, useful life and residual value. Total depreciation = cost − residual value.",
      "<b>Straight-line</b>: same charge each year. <b>Reducing balance</b>: fixed % × NBV at the START of the year, so the charge falls each year.",
      "<b>NBV</b> (depreciated cost) = cost − accumulated depreciation. Revaluation to fair value is optional (usually land and buildings) and must be kept up to date. Revaluation gain goes to the <b>revaluation reserve</b> in equity, NOT the P&L. Land and buildings are not depreciated in these examples.",
      "<b>Prepayment</b> (paid in advance) = current asset, reduces expense. <b>Accrual</b> (incurred, not paid) = current liability, increases expense.",
      "<b>Bad debt</b> (definitely won't be paid, e.g. bankrupt) is written off. <b>Provision for doubtful debts</b> = estimate on REMAINING receivables. P&L charge = write-offs + INCREASE in provision (a decrease reduces the charge). SOFP: receivables − provision.",
      "<b>Drawings</b>: cash taken, goods taken (at cost, out of purchases), private share of expenses, and a sole trader's personal income tax paid by the business.",
      "<b>Sole trader</b>: no tax in P&L; net profit added to capital. <b>Company</b>: tax on profits is a P&L expense; profit after tax goes to retained earnings; dividends are paid from it. Both show interest as a finance cost."
    ],
    formulas: [
      "Straight-line = (Cost − Residual) ÷ Useful life",
      "Reducing balance = Rate × Opening NBV",
      "Cost of sales = Opening inventory + Purchases − Returns outward − Closing inventory",
      "Gross profit = (Sales − Returns inward) − Cost of sales",
      "Bad & doubtful debts charge = Write-offs + (New provision − Old provision)",
      "Prepayment = Payment × (months unused ÷ months covered)"
    ]
  },
  6: {
    summary: "Current assets, working capital and its cycle, inventory (lower of cost and NRV), receivables, prepayments, current investments, cash, and SOFP layout and adjustments.",
    points: [
      "<b>Current asset</b>: controlled, from a past event, expected to be sold or turned into cash within a short time (usually under 12 months). Examples: raw materials, WIP, finished goods, trade receivables, prepayments and accrued income, current investments, short-term deposits, cash at bank and in hand.",
      "<b>Working capital</b> = CA − CL. Too low: may not pay bills on time. Too high: money tied up that could fund non-current assets/growth.",
      "<b>Working capital cycle</b>: buy inventory → sell on credit (receivables) → collect cash → pay suppliers.",
      "Recognition can be questioned when there is doubt about benefit or reliable measurement (cash is the most certain; WIP and doubtful debts are less certain).",
      "<b>Inventory</b> at the <b>lower of cost and NRV</b>, ITEM BY ITEM. A gain on one item cannot offset a loss on another (prudence).",
      "<b>WIP</b> has extra non-completion risk; measure it at the cost of work done. Raw materials: lower of cost and NRV.",
      "<b>Receivables</b>: trade (credit customers) vs other debtors (loans to employees or other businesses, tax refunds due). Shown at selling price less any provision.",
      "<b>Current investments</b> at fair value (mark to market); fair-value changes go to the <b>income statement</b>.",
      "<b>Cash</b>: verified by counting or by the bank statement; the most reliable current asset.",
      "<b>SOFP layout</b>: NCA (cost, acc. dep., NBV) + CA − CL = total assets less current liabilities; − NCL = net assets = capital.",
      "Adjustments: accruals → CL; prepayments → CA; depreciation → raises accumulated depreciation; bad debts/provision → reduce receivables; profit raises capital; drawings reduce it.",
      "A <b>proposed</b> dividend not yet recognised is NOT deducted from retained earnings (Smith Plc: 209,106 + 41,635 = 250,741)."
    ],
    formulas: [
      "Working capital = Current assets − Current liabilities",
      "Net assets = Total assets less current liabilities − Non-current liabilities",
      "Closing capital = Opening capital + Profit − Drawings",
      "Retained earnings = Opening + Profit for year − Dividends paid (not proposed)"
    ]
  }
};

/* ============ TRUE / FALSE ============ */
const TF = [

  ["£116,750","Correct."],
  ["£45,350","You used only non-current assets (112,600 − 67,250)."],
  ["£4,150","You used only current assets (71,400 − 67,250)."],
  ["£251,250","You added ownership interest to assets."]],
  steps:["Total assets = 112,600 + 71,400 = £184,000","Liabilities = Assets − Ownership interest","= 184,000 − 67,250 = £116,750"],
  exp:"Rearrange A = L + OI to get L = A − OI, using TOTAL assets."},
 {t:2,q:"Which item meets the definition of an asset for the business?",o:[
  ["A trade receivable from a customer who is expected to pay","Correct. Controlled, from a past sale, with expected future cash."],
  ["A loyal and highly trained workforce","The business does not control its staff and the benefit is uncertain."],
  ["The owner's personal house, offered as security for a loan","The business does not control the owner's personal property."],
  ["A new advertising campaign expected to boost sales","The benefit is too uncertain and there is no evidence that cash will flow in."]],
  exp:"Three tests: future benefit, control, and a past event. A receivable passes all three as long as the customer is expected to pay."},
 {t:2,sub:"Calculation",q:"Opening ownership interest £25,000. During the year the owner contributes £6,000 and withdraws £4,500. Revenue is £52,000 and expenses £39,750. What are net assets at the year end?",o:[
  ["£38,750","Correct."],
  ["£47,750","You ADDED the withdrawals."],
  ["£32,750","You left out the £6,000 contribution."],
  ["£12,250","That is only the profit, not closing net assets."]],
  steps:["Closing = Opening + Contributions − Withdrawals + Revenue − Expenses","= 25,000 + 6,000 − 4,500 + 52,000 − 39,750","= £38,750"],
  exp:"Change in net assets = change in ownership interest. Only trading and owner transactions change it."},
 {t:2,q:"Land costing £90,000 is bought: £30,000 paid in cash and a note payable signed for the rest. What is the overall effect?",o:[
  ["Total assets ↑ £60,000; liabilities ↑ £60,000","Correct. Land +90,000 and cash −30,000 give net assets +60,000; the note payable is +60,000."],
  ["Total assets ↑ £90,000; liabilities ↑ £90,000","You forgot that cash went DOWN by £30,000, and only £60,000 is owed."],
  ["Total assets ↑ £90,000; liabilities ↑ £60,000; ownership interest ↑ £30,000","The owner put nothing in; there is no change to ownership interest."],
  ["Total assets ↑ £60,000; ownership interest ↑ £60,000","The £60,000 is borrowed, so it is a liability, not ownership interest."]],
  steps:["Land (asset) +90,000","Cash (asset) −30,000 → net assets +60,000","Note payable (liability) +60,000","Equation: +60,000 = +60,000 ✔"],
  exp:"Work out each item separately before netting. The cash part is just an asset swap; the credit part creates a liability."},
 {t:2,q:"The owner transfers her personal truck, worth £15,000, into the business. What is the effect?",o:[
  ["Assets ↑ and ownership interest ↑","Correct. A non-cash contribution from the owner is still capital introduced."],
  ["Assets ↑ and liabilities ↑","The business does not owe anyone; the owner contributed it."],
  ["No effect, because no cash changed hands","Non-cash contributions are still recorded."],
  ["Assets ↑ and revenue ↑","It was not earned by trading, so it is not revenue."]],
  exp:"Money (or assets) from the owner creates ownership interest. Borrowed money creates a liability."},
 {t:2,q:"Which of the following increases with a DEBIT entry?",o:[
  ["Drawings","Correct. Drawings reduce ownership interest, so they are debits."],
  ["Sales revenue","Revenue increases ownership interest, so it is a credit."],
  ["Trade payables","Liabilities increase with a credit."],
  ["Capital","Capital (ownership interest) increases with a credit."]],
  exp:"Assets, expenses and drawings increase with debits. Liabilities, capital and revenue increase with credits."},
 {t:2,q:"Land bought for £200,000 several years ago could now be sold for £350,000 in an orderly transaction between market participants. At what amount is it measured under FAIR VALUE?",o:[
  ["£350,000","Correct. Fair value is today's market exit price."],
  ["£200,000","That is historical cost."],
  ["£150,000","That is the increase in value, not the value."],
  ["£550,000","You added cost and market value."]],
  exp:"Historical cost looks back to the day of the deal. Fair value looks at the market today."},
 {t:2,q:"Company X billed a client $5,000 in May; the client paid in June. What is the effect on Company X's TOTAL ASSETS in June?",o:[
  ["No change: cash ↑ $5,000 and amount due ↓ $5,000","Correct. Collection only swaps one asset for another."],
  ["Increase of $5,000 because cash is received","Cash rises but the receivable falls by the same amount."],
  ["Increase of $5,000 and revenue is recognised in June","Revenue was earned and recognised in May, when the service was done."],
  ["Decrease of $5,000 as the receivable is removed","Cash comes in at the same time, so the total does not fall."]],
  exp:"Revenue is earned when the service is done (May). In June it is just cash in, receivable out."},
 {t:2,q:"A possible legal action over defective products may never happen. How is it most likely treated?",o:[
  ["Disclosed in the notes as a contingent liability","Correct. It fails the recognition test, but prudence says mention it."],
  ["Recognised as a current liability","It is not a present obligation; it may never happen."],
  ["Ignored completely","Prudence says it should be disclosed."],
  ["Recognised as an expense and a provision in the SOFP","It does not meet recognition criteria, so it is not recognised in the main statements."]],
  exp:"A contingent liability is uncertain. It is not put in the main statement but may be mentioned in the notes."},
 {t:2,q:"An expense of £800 is incurred and paid immediately in cash. Which entries are made?",o:[
  ["Debit Expense £800, Credit Cash £800","Correct. Expense (reduces OI) = debit; cash (asset down) = credit."],
  ["Debit Cash £800, Credit Expense £800","This is the wrong way round."],
  ["Credit Expense £800, Credit Cash £800","Two credits cannot balance."],
  ["Debit Expense £800, Debit Cash £800","Two debits cannot balance."]],
  exp:"Every transaction needs an equal debit and credit."},

 // ---------- Topic 3 ----------
 {t:3,q:"What is the status of the Conceptual Framework?",o:[
  ["It is not a standard; it sets out the concepts that guide standard-setting","Correct."],
  ["It is a mandatory accounting standard that overrides IFRS","It is not a standard and does not override IFRS."],
  ["It replaces IFRS Standards where they conflict","It sits behind the standards; it does not replace them."],
  ["It is a set of tax rules agreed with HMRC","It has nothing to do with tax law."]],
  exp:"Framework = principles. IFRS Standards = detailed rules built on those principles. It also helps when no IFRS covers a transaction."},
 {t:3,q:"Goods are delivered on 28 December 2026, invoiced on 3 January 2027 and paid for in February 2027. The year end is 31 December. Under the accrual basis, the revenue belongs to:",o:[
  ["The year ended 31 December 2026","Correct. The transaction (delivery) happened in December."],
  ["The year ending 2027, when the invoice is issued","The invoice date does not decide the period."],
  ["The year ending 2027, when the cash is received","That would be the cash basis."],
  ["Half to each year","Revenue is not split; it belongs to the period in which it occurred."]],
  exp:"Accrual basis: record when the transaction happens, not when cash moves or paperwork is filed."},
 {t:3,q:"The directors announce that the company will be closed down. Which of these would NOT follow?",o:[
  ["Assets continue to be shown at cost less depreciation","Correct (this would NOT follow). Cost less depreciation relies on the going concern assumption."],
  ["Assets are shown at realisable (break-up) value","This does follow when a business is not a going concern."],
  ["Long-term items are reclassified as current","This does follow, as everything will be settled soon."],
  ["Extra costs such as redundancy pay are recognised","This does follow on a break-up basis."]],
  exp:"Going concern is WHY assets are normally at cost less depreciation. Remove it and you switch to a break-up basis."},
 {t:3,q:"Which of the following is NOT one of the four qualitative characteristics listed in the lecture?",o:[
  ["Neutrality","Correct. Neutrality is a COMPONENT of reliability, not one of the four."],
  ["Understandability","This is one of the four."],
  ["Comparability","This is one of the four."],
  ["Reliability","This is one of the four."]],
  exp:"The four are understandability, relevance, comparability and reliability. Reliability contains faithful representation, substance over form, neutrality, prudence and completeness."},
 {t:3,q:"Sara 'sells' her £20,000 oven to a finance company and leases it back for 5 years, paying fees equal to loan repayments. She continues to use and insure it. Which principle requires her NOT to record a £5,000 profit on sale?",o:[
  ["Substance over form","Correct. In substance it is a loan secured on the oven, not a sale."],
  ["Prudence","Prudence is about caution under uncertainty; the issue here is what the deal really is."],
  ["Comparability","Nothing here concerns comparisons over time or between businesses."],
  ["Materiality","The problem is the nature of the transaction, not its size."]],
  exp:"Form (contract says 'sale') vs substance (she keeps the risks and benefits and repays like a loan). Report the substance."},
 {t:3,sub:"Calculation",q:"An asset will produce a single net cash inflow of £26,620 in THREE years' time. The discount rate is 10%. What is its present value?",o:[
  ["£20,000","Correct. 26,620 ÷ 1.331."],
  ["£22,000","You discounted for only two years (÷ 1.21)."],
  ["£24,200","You discounted for only one year (÷ 1.10)."],
  ["£18,634","You took 30% off instead of discounting."]],
  steps:["(1.10)³ = 1.10 × 1.10 × 1.10 = 1.331","PV = 26,620 ÷ 1.331 = £20,000"],
  exp:"PV = FV ÷ (1 + r)ⁿ. Discounting compounds; it is not a simple percentage deduction."},
 {t:3,sub:"Calculation",q:"£14,520 will be received in two years. Using a 10% discount rate, what is its present value?",o:[
  ["£12,000","Correct. 14,520 ÷ 1.21."],
  ["£13,200","That discounts for only one year."],
  ["£11,616","You took 20% off (14,520 × 0.8)."],
  ["£14,520","That is the undiscounted amount."]],
  steps:["(1.10)² = 1.21","PV = 14,520 ÷ 1.21 = £12,000"],
  exp:"For two years divide by 1.21, not by 1.20 and not by subtracting 20%."},
 {t:3,q:"The amount a business would receive if it sold its van today is which measurement basis?",o:[
  ["Realisable value","Correct. 'Sell today' = realisable value."],
  ["Current cost","Current cost is what it would cost to REPLACE the van today."],
  ["Historical cost","That is the amount originally paid."],
  ["Present value","That is future cash flows discounted to today."]],
  exp:"Historical = past; current cost = replace today; realisable = sell today; present value = future cash in today's money."},
 {t:3,q:"A £2,000 inventory loss, against operating profit of £60m, turns out to have been caused by a director's fraud. How should materiality be judged?",o:[
  ["It may be material because of its nature, even though it is small","Correct. Materiality depends on importance as well as size."],
  ["It is immaterial because it is tiny compared with profit","Size alone is not the test; fraud makes the nature important."],
  ["It breaches the going concern assumption","Nothing suggests the business will stop trading."],
  ["It is only a comparability issue","Comparability is unaffected by this."]],
  exp:"Usually a £2,000 loss against £60m profit would be immaterial. But the lecture warns that a small amount caused by fraud may still need to be shown."},
 {t:3,q:"A company switches its inventory method from average cost to FIFO. What best protects comparability?",o:[
  ["Disclose the change, the reason and last year's profit on the new basis","Correct."],
  ["Make the change without comment, as both methods are acceptable","A silent change breaks comparability."],
  ["Never change any accounting policy","Policies may change when there is a good reason."],
  ["Adopt the method used by its main competitor without disclosure","It must still be explained."]],
  exp:"Users must be able to compare years. A change is allowed, but the reason and effect must be shown."},
 {t:3,q:"A shareholder prefers land to be shown at its market value of £20m rather than its historical cost of £5m. Which statement is correct?",o:[
  ["Market value is more relevant, but historical cost is more reliable","Correct. This is the relevance–reliability trade-off."],
  ["Market value is both more relevant and more reliable","Market values change and are harder to prove, so they are less reliable."],
  ["Historical cost is more relevant because it is backed by an invoice","An invoice makes it reliable, not more relevant to today's decisions."],
  ["Both are equally relevant and reliable","That is why the Framework allows several measurement bases: they differ."]],
  exp:"There is no single best basis: the most relevant measure is not always the most reliable."},
 {t:3,q:"Reporting before all aspects of a transaction are known improves timeliness but reduces:",o:[
  ["Reliability","Correct. Estimates make the information less certain."],
  ["Understandability","Understandability is not directly affected."],
  ["Cost","Cost is a separate constraint."],
  ["Materiality","Materiality is about size and importance."]],
  exp:"Timeliness swaps some reliability for relevance."},
 {t:3,q:"Statements are NOT neutral if they are:",o:[
  ["Prepared to achieve a predetermined result","Correct. Neutrality means free from bias."],
  ["Cautious about recognising uncertain income","That is prudence (which can clash with neutrality, but is not itself a lack of neutrality in the lecture's example)."],
  ["Showing comparative figures for last year","That supports comparability."],
  ["Prepared in line with international standards","That supports comparability."]],
  exp:"Neutrality = free from bias. Shaping the numbers to reach a chosen result is the opposite."},

 // ---------- Topic 4 ----------
 {t:4,q:"Which statement reports an entity's financial ADAPTABILITY?",o:[
  ["Statement of cash flows","Correct."],
  ["Statement of financial position","It shows financial position."],
  ["Income statement","It shows financial performance."],
  ["Notes to the accounts","Notes are not one of the three primary statements."]],
  exp:"Position = SOFP; performance = income statement; adaptability = statement of cash flows."},
 {t:4,sub:"Calculation",q:"During the year a business sold an old machine for £8,500, bought equipment for £32,000, bought a patent for £4,000, issued shares for £50,000, repaid a loan of £12,000 and paid suppliers £15,000. What is the net cash flow from INVESTING activities?",o:[
  ["£27,500 outflow","Correct."],
  ["£23,500 outflow","You left out the patent. Buying an intangible non-current asset is also investing."],
  ["£44,500 outflow","You treated the sale proceeds as an outflow."],
  ["£10,500 inflow","You included financing flows (shares and loan repayment)."]],
  steps:["Investing = buying/selling non-current assets only","= +8,500 − 32,000 − 4,000","= −£27,500 (outflow)","Shares and loan = financing; suppliers = operating"],
  exp:"Classify each flow first, then net only the investing items."},
 {t:4,sub:"Calculation",q:"Using the same data (shares issued £50,000; loan repaid £12,000; other flows as before), what is the net cash flow from FINANCING activities?",o:[
  ["£38,000 inflow","Correct. 50,000 − 12,000."],
  ["£62,000 inflow","You added the loan repayment instead of deducting it."],
  ["£50,000 inflow","You left out the loan repayment."],
  ["£23,000 inflow","You included the payment to suppliers (an operating flow)."]],
  steps:["Financing = shares, raising/repaying loans","= +50,000 − 12,000 = +£38,000"],
  exp:"Repaying a loan is a financing OUTFLOW."},
 {t:4,sub:"Calculation",q:"Net operating cash flow is +£42,000, net investing −£67,500 and net financing +£18,000. What is the change in cash?",o:[
  ["Decrease of £7,500","Correct. 42,000 − 67,500 + 18,000."],
  ["Increase of £7,500","The sign is wrong: investing outflows exceed the other inflows."],
  ["Decrease of £43,500","You treated financing as an outflow."],
  ["Increase of £127,500","You added all three as inflows."]],
  steps:["Change in cash = operating + investing + financing","= 42,000 + (−67,500) + 18,000 = −£7,500"],
  exp:"Keep the signs: investing was an outflow, financing an inflow."},
 {t:4,sub:"Calculation",q:"For the month: revenue £18,400; cost of goods sold £9,650; wages £3,900; gas £620; depreciation £1,150. What is the profit?",o:[
  ["£3,080","Correct."],
  ["£4,230","You ignored depreciation because it is not cash. It is still an expense."],
  ["£8,750","That is gross profit only."],
  ["£15,320","That is total costs, not profit."]],
  steps:["Gross profit = 18,400 − 9,650 = £8,750","Other expenses = 3,900 + 620 + 1,150 = £5,670","Profit = 8,750 − 5,670 = £3,080"],
  exp:"Depreciation is a non-cash EXPENSE: it reduces profit even though no cash leaves."},
 {t:4,sub:"Calculation",q:"A bank ledger opens with a £60,000 debit (capital). Then: rent paid £2,500; fittings paid £12,000; cash sales received £9,500; wages paid £3,800. How is the closing balance shown?",o:[
  ["£51,200","Correct. It is a debit balance, shown as a positive number."],
  ["(£51,200)","Brackets show a CREDIT balance; this account is in debit."],
  ["£32,200","You treated the sales receipt as a payment."],
  ["£87,800","You added the payments instead of deducting them."]],
  steps:["Receipts (debits): 60,000 + 9,500 = 69,500","Payments (credits): 2,500 + 12,000 + 3,800 = 18,300","Balance = 69,500 − 18,300 = £51,200 debit (positive)"],
  exp:"In the bank account money in is a debit, money out a credit. A debit balance is shown positive."},
 {t:4,q:"Greenfield School returns uniforms invoiced at £350 and a credit note is issued. Which entry is correct in the seller's books?",o:[
  ["Debit Sales returns, Credit Trade receivables","Correct. Sales returns is a debit and the school now owes less."],
  ["Debit Trade receivables, Credit Sales returns","This is the wrong way round."],
  ["Debit Sales, Credit Bank","No cash was involved, and returns have their own account."],
  ["Debit Trade payables, Credit Purchases returns","That is the entry for goods sent back TO a supplier."]],
  exp:"Goods back from a customer: Dr Sales returns, Cr Trade receivables. Goods back to a supplier: Dr Trade payables, Cr Purchases returns."},
 {t:4,q:"Khan sends back £1,000 of faulty goods to his supplier, Northline. Which entry is correct in Khan's books?",o:[
  ["Debit Trade payables, Credit Purchases returns","Correct. Khan owes less, and purchases are reduced via a separate returns account."],
  ["Debit Purchases returns, Credit Trade payables","This is the wrong way round."],
  ["Debit Sales returns, Credit Trade receivables","That is for goods returned BY a customer."],
  ["Debit Bank, Credit Purchases","No cash moved, and returns are not deducted directly from Purchases."]],
  exp:"A credit note cancels part of a credit purchase, so the amount owed falls (debit the liability)."},
 {t:4,q:"Clothing is bought on credit for £18,000. What is the journal entry?",o:[
  ["Debit Purchases £18,000, Credit Trade payables £18,000","Correct."],
  ["Debit Trade payables, Credit Purchases","This is the wrong way round."],
  ["Debit Purchases, Credit Bank","It was on credit, not paid from the bank."],
  ["Debit Inventory, Credit Sales","Sales are not involved in a purchase."]],
  exp:"Buying on credit creates a liability (credit Trade payables)."},
 {t:4,sub:"Calculation",q:"A trial balance has debit balances: Bank £51,600, Fittings £12,000, Rent £2,500, Purchases £18,000, Drawings £4,000, Wages £1,400. Credit balances: Capital £60,000, Sales £25,000 and Trade payables. If it balances, what is Trade payables?",o:[
  ["£4,500","Correct."],
  ["£500","You left drawings out of the debit column. Drawings are a debit balance."],
  ["£3,100","You left wages out of the debit column."],
  ["£89,500","That is the debit total, not the payables figure."]],
  steps:["Debits = 51,600 + 12,000 + 2,500 + 18,000 + 4,000 + 1,400 = £89,500","Credits = 60,000 + 25,000 + Payables","Payables = 89,500 − 85,000 = £4,500"],
  exp:"Debit side: assets, expenses, drawings. Credit side: liabilities, capital, revenue."},
 {t:4,q:"Which of these accounts has a CREDIT balance in the trial balance?",o:[
  ["Purchases returns","Correct. Purchase returns reduce purchases (a debit), so they are a credit."],
  ["Sales returns","Sales returns reduce sales (a credit), so they are a debit."],
  ["Drawings","Drawings are a debit."],
  ["Prepaid rent","A prepayment is an asset, so it is a debit."]],
  exp:"Contra accounts take the opposite side to the account they reduce."},
 {t:4,sub:"Calculation",q:"Inventory is bought for £8,500, £7,000 and £4,250. Goods costing £5,500 and £6,100 are then sold for a total of £14,800. What is the inventory balance?",o:[
  ["£8,150","Correct."],
  ["£4,950","You deducted the SELLING price instead of the cost."],
  ["£19,750","You forgot to remove the goods sold."],
  ["£11,600","That is the cost of goods sold."]],
  steps:["Purchases = 8,500 + 7,000 + 4,250 = £19,750","Cost of goods sold = 5,500 + 6,100 = £11,600","Inventory = 19,750 − 11,600 = £8,150"],
  exp:"Dr COGS, Cr Inventory at COST. The selling price goes to revenue."},
 {t:4,sub:"Calculation",q:"Equipment cost £12,000 and is depreciated by £550 a month. What is its net amount after April and May?",o:[
  ["£10,900","Correct."],
  ["£11,450","That is after only one month."],
  ["£13,100","You added depreciation."],
  ["£1,100","That is accumulated depreciation, not the net amount."]],
  steps:["Accumulated depreciation = 550 × 2 = £1,100","Net amount = 12,000 − 1,100 = £10,900"],
  exp:"Accumulated depreciation sits next to cost, so the original cost stays visible."},
 {t:4,q:"Which is the MOST likely reason a profitable business is short of cash?",o:[
  ["It made large credit sales and paid cash for a new van","Correct. Credit sales boost profit before cash arrives; the van uses cash but is not an expense."],
  ["Its drawings were recorded as an expense","Drawings are not an expense; that would not explain a cash shortage."],
  ["Depreciation used up its cash","Depreciation is non-cash."],
  ["Revenue is only recorded when cash arrives","That is the cash basis; under accruals revenue is recorded earlier."]],
  exp:"Profit ≠ cash because of working capital (credit, inventory) and capital spending, loans and shares."},
 {t:4,q:"Which stage comes between the accounting records and the financial statements?",o:[
  ["Rules of measurement and disclosure","Correct."],
  ["Practice of bookkeeping","That comes BEFORE the accounting records."],
  ["Transactions and events","That is the very first step."],
  ["Auditing","Auditing is not a step in the lecture's flow."]],
  exp:"Transactions → bookkeeping → records → measurement & disclosure rules → statements."},

 // ---------- Topic 5 ----------
 {t:5,sub:"Calculation",q:"A machine costs £30,000. Installation costs £2,000, legal fees £500, commissioning (testing) £800 and the first-year servicing contract £900. At what cost is the machine recorded?",o:[
  ["£33,300","Correct."],
  ["£34,200","You capitalised the servicing contract, which is a running cost (expense)."],
  ["£32,000","You only added installation."],
  ["£30,000","You left out all the costs of getting it ready to use."]],
  steps:["Cost = price + costs of getting it ready to use","= 30,000 + 2,000 + 500 + 800 = £33,300","Servicing £900 is a running cost → P&L expense"],
  exp:"Capitalise legal, installation and commissioning costs. Running costs are expenses."},
 {t:5,sub:"Calculation",q:"An asset costs £48,000, has a residual value of £6,000 and a useful life of 7 years. What is the annual straight-line depreciation?",o:[
  ["£6,000","Correct. (48,000 − 6,000) ÷ 7."],
  ["£6,857","You ignored the residual value (48,000 ÷ 7)."],
  ["£42,000","That is TOTAL depreciation."],
  ["£4,800","That is 10% of cost, not the formula."]],
  steps:["Depreciable amount = 48,000 − 6,000 = £42,000","Annual charge = 42,000 ÷ 7 = £6,000"],
  exp:"Straight-line = (cost − residual) ÷ life."},
 {t:5,sub:"Calculation",q:"An asset cost £36,500, residual value £4,500, life 8 years, straight-line. What is its NBV at the end of year 3?",o:[
  ["£24,500","Correct."],
  ["£20,000","You also deducted the residual value from NBV."],
  ["£32,500","That is NBV after only one year."],
  ["£22,812.50","You ignored residual value when calculating the annual charge."]],
  steps:["Annual charge = (36,500 − 4,500) ÷ 8 = £4,000","Accumulated depreciation after 3 years = £12,000","NBV = 36,500 − 12,000 = £24,500"],
  exp:"Residual value is used to work out the charge; it is not deducted again from NBV."},
 {t:5,sub:"Calculation",q:"An asset costs £25,000 and is depreciated at 20% reducing balance. What is the depreciation charge in YEAR 3?",o:[
  ["£3,200","Correct."],
  ["£5,000","That is 20% of cost (straight-line style)."],
  ["£4,000","That is the year 2 charge."],
  ["£12,800","That is NBV at the end of year 3."]],
  steps:["Y1: 20% × 25,000 = 5,000 → NBV 20,000","Y2: 20% × 20,000 = 4,000 → NBV 16,000","Y3: 20% × 16,000 = £3,200 → NBV 12,800"],
  exp:"Reducing balance applies the rate to the opening NBV each year, so the charge keeps falling."},
 {t:5,sub:"Calculation",q:"Motor vehicles cost £85,000 with accumulated depreciation of £30,600. Depreciation is 20% reducing balance. What is this year's charge?",o:[
  ["£10,880","Correct. 20% × 54,400."],
  ["£17,000","That is 20% of cost, not NBV."],
  ["£6,120","That is 20% of accumulated depreciation."],
  ["£43,520","That is the NBV after this year's charge."]],
  steps:["NBV = 85,000 − 30,600 = £54,400","Charge = 20% × 54,400 = £10,880"],
  exp:"Same logic as Smith Plc: (120,000 − 43,200) × 20% = 15,360."},
 {t:5,sub:"Calculation",q:"Insurance of £4,800 is paid on 1 September for the year to 31 August. The year end is 31 December. What is the prepayment?",o:[
  ["£3,200","Correct. 8 months (Jan–Aug) are unused."],
  ["£1,600","That is the 4 months used (Sep–Dec), i.e. this year's expense."],
  ["£4,800","That is the whole payment."],
  ["£400","That is just one month."]],
  steps:["Monthly cost = 4,800 ÷ 12 = £400","Months used by 31 Dec: Sep–Dec = 4 → expense £1,600","Months unused: Jan–Aug = 8 → prepayment 8 × 400 = £3,200"],
  exp:"Prepayment = payment × unused months ÷ months covered; it is a current asset."},
 {t:5,q:"Annual rent is £9,000. By the year end only £6,750 has been paid. What appears in the financial statements?",o:[
  ["Rent expense £9,000; accrual (current liability) £2,250","Correct."],
  ["Rent expense £6,750; accrual £2,250","The expense must include the unpaid amount used this year."],
  ["Rent expense £9,000; prepayment (current asset) £2,250","Rent is underpaid, not paid in advance, so it is owed."],
  ["Rent expense £6,750; no adjustment","That is the cash basis."]],
  steps:["Expense = full year's cost = £9,000","Unpaid = 9,000 − 6,750 = £2,250 → accrual (current liability)"],
  exp:"An accrual is ADDED to the expense and shown as a current liability."},
 {t:5,sub:"Calculation",q:"Receivables before write-offs are £92,000. Bad debts of £4,000 are written off. The provision for doubtful debts is to be 5% of remaining receivables; the existing provision is £3,800. What is the total P&L charge for bad and doubtful debts?",o:[
  ["£4,600","Correct. 4,000 write-off + 600 increase."],
  ["£8,400","You charged the whole new provision instead of the increase."],
  ["£4,800","You calculated the provision on receivables BEFORE the write-off."],
  ["£600","You forgot the bad debt written off."]],
  steps:["Remaining receivables = 92,000 − 4,000 = £88,000","New provision = 5% × 88,000 = £4,400","Increase = 4,400 − 3,800 = £600","P&L charge = 4,000 + 600 = £4,600"],
  exp:"Write off first, then provide on what is left, and charge only the CHANGE in provision."},
 {t:5,sub:"Calculation",q:"Using the same data (receivables £92,000, write-off £4,000, 5% provision), what is the net receivables figure in the SOFP?",o:[
  ["£83,600","Correct. 88,000 − 4,400."],
  ["£88,000","You forgot the provision."],
  ["£84,200","You used the OLD provision (£3,800)."],
  ["£87,400","You deducted only the increase in provision."]],
  steps:["Receivables after write-off = £88,000","Less provision 5% = £4,400","Net = £83,600"],
  exp:"In the SOFP the FULL provision is deducted; in the P&L only the change is charged."},
 {t:5,sub:"Calculation",q:"Receivables are £60,000. The provision is to be 4% and the existing provision is £3,000. What is the effect on the P&L?",o:[
  ["The provision falls by £600, reducing the charge (increasing profit)","Correct. New provision = 2,400; old = 3,000."],
  ["A charge of £2,400","Only the change goes to the P&L, not the whole provision."],
  ["A charge of £600 (an increase in the provision)","The provision has gone DOWN, not up."],
  ["No effect: provisions only affect the SOFP","The change in provision does go through the P&L."]],
  steps:["New provision = 4% × 60,000 = £2,400","Existing = £3,000 → decrease of £600","A decrease reduces the bad debt charge (credit to P&L)"],
  exp:"An increase in provision is charged; a decrease is released (credited) back."},
 {t:5,sub:"Calculation",q:"A sole trader takes goods costing £2,100 for personal use, 30% of the £3,000 phone bill is private, the business pays her £7,500 personal income tax, and she withdraws £18,000 cash. What are total drawings?",o:[
  ["£28,500","Correct."],
  ["£21,000","You treated income tax as a business expense. A sole trader's personal tax is a drawing."],
  ["£27,600","You ignored the private use of the phone."],
  ["£30,600","You included the whole phone bill instead of the 30% private part."]],
  steps:["Goods at cost = £2,100","Private phone = 30% × 3,000 = £900","Personal income tax = £7,500","Cash = £18,000","Total = 2,100 + 900 + 7,500 + 18,000 = £28,500"],
  exp:"Only business costs belong in the P&L. Personal items, including personal tax, are drawings."},
 {t:5,sub:"Calculation",q:"Opening inventory £14,200; purchases £86,500; returns outward £3,700; goods taken by the owner at cost £1,200; closing inventory £16,800. What is the cost of sales?",o:[
  ["£79,000","Correct."],
  ["£80,200","You ignored the goods taken by the owner, which come out of purchases."],
  ["£86,400","You ADDED returns outward instead of deducting them."],
  ["£112,600","You added closing inventory instead of deducting it."]],
  steps:["Purchases less returns and drawings = 86,500 − 3,700 − 1,200 = £81,600","Cost of sales = 14,200 + 81,600 − 16,800 = £79,000"],
  exp:"Cost of sales = opening inventory + net purchases − closing inventory. Goods taken by the owner reduce purchases."},
 {t:5,sub:"Calculation",q:"Sales £162,000; returns inward £4,500; cost of sales £79,000. What is gross profit?",o:[
  ["£78,500","Correct."],
  ["£83,000","You ignored returns inward."],
  ["£87,500","You added returns inward."],
  ["£74,000","You deducted returns inward twice."]],
  steps:["Net sales = 162,000 − 4,500 = £157,500","Gross profit = 157,500 − 79,000 = £78,500"],
  exp:"Returns inward (sales returns) reduce sales; returns outward reduce purchases."},
 {t:5,sub:"Calculation",q:"A plc has gross profit £98,300 and operating expenses £54,750. It has an £80,000 loan at 9% interest (none paid yet) and tax for the year of £8,400. A dividend of £5,000 is proposed but not recognised. What is the profit for the year?",o:[
  ["£27,950","Correct."],
  ["£22,950","You deducted the proposed dividend. Dividends are not an expense and this one is not even recognised."],
  ["£36,350","You ignored tax. For a company, tax is a P&L expense."],
  ["£35,150","You ignored the loan interest, which must be accrued even though unpaid."]],
  steps:["Profit before interest and tax = 98,300 − 54,750 = £43,550","Interest = 9% × 80,000 = £7,200 (accrued)","Tax = £8,400","Profit for the year = 43,550 − 7,200 − 8,400 = £27,950"],
  exp:"Company P&L: PBIT − finance cost − tax = profit for the year, which then goes to retained earnings."},
 {t:5,q:"Land carried at £400,000 is revalued to £465,000. The revaluation reserve was £35,000. What are the new reserve and the effect on profit?",o:[
  ["Reserve £100,000; profit unchanged","Correct. 35,000 + 65,000, and the gain bypasses the P&L."],
  ["Reserve £35,000; profit up £65,000","Revaluation gains are not trading income."],
  ["Reserve £100,000; profit up £65,000","The gain cannot be counted twice; it only goes to the reserve."],
  ["Reserve £65,000; profit unchanged","You forgot the opening reserve of £35,000."]],
  steps:["Gain = 465,000 − 400,000 = £65,000","Reserve = 35,000 + 65,000 = £100,000","P&L not affected"],
  exp:"Revaluation reserve is part of equity. Profit is not affected."},
 {t:5,q:"Which of the following is CAPITAL expenditure?",o:[
  ["Fitting a more powerful engine that increases a bus's capacity and extends its life","Correct. It improves the asset (better output, longer life)."],
  ["Replacing a worn bus engine with an identical one","That restores original condition: a repair."],
  ["Replacing a roof damaged in a storm","That is a repair, expensed in the P&L."],
  ["Routine servicing of the bus","That is a running cost."]],
  exp:"Improvements add new future benefit and are capitalised. Repairs only keep the benefit already expected."},
 {t:5,q:"Which item appears in a company's P&L but NOT in a sole trader's?",o:[
  ["Tax expense on profits","Correct. A sole trader's tax is personal and is treated as drawings."],
  ["Loan interest","Both can show interest as a finance cost."],
  ["Depreciation","Both have depreciation."],
  ["Wages","Both have wages."]],
  exp:"A company is its own legal person and pays its own tax; a sole trader is taxed personally."},
 {t:5,q:"Net book value is best described as:",o:[
  ["Cost less accumulated depreciation","Correct."],
  ["The asset's current market value","NBV is a calculation, not a market value."],
  ["Cost less residual value","That is the depreciable amount (total depreciation)."],
  ["The cost to replace the asset today","That is current cost."]],
  exp:"NBV, also called depreciated cost = cost − accumulated depreciation."},

 // ---------- Topic 6 ----------
 {t:6,sub:"Calculation",q:"Inventory £22,800; receivables (net) £87,885; prepayment £2,000; cash £155,000. Trade payables £64,344; accrued interest £11,640; tax payable £10,000; 5-year bank loan £116,400. What is working capital?",o:[
  ["£181,701","Correct."],
  ["£65,301","You deducted the bank loan, which is non-current."],
  ["£193,341","You left out accrued interest (a current liability)."],
  ["£26,701","You left out cash."]],
  steps:["Current assets = 22,800 + 87,885 + 2,000 + 155,000 = £267,685","Current liabilities = 64,344 + 11,640 + 10,000 = £85,984","Working capital = 267,685 − 85,984 = £181,701"],
  exp:"Working capital uses CURRENT items only; the loan is non-current."},
 {t:6,sub:"Calculation",q:"Inventory: P cost £14,600, NRV £13,200; Q cost £9,350, NRV £11,800; R cost £6,400, NRV £6,050; S cost £2,900, NRV £4,100. At what amount is inventory shown?",o:[
  ["£31,500","Correct. Lower of cost and NRV, item by item."],
  ["£33,250","That is total cost; it ignores P and R falling below cost."],
  ["£31,850","You used cost for R although its NRV is lower."],
  ["£35,150","That is total NRV; it counts unrealised profit on Q and S."]],
  steps:["P: lower = 13,200 (NRV)","Q: lower = 9,350 (cost)","R: lower = 6,050 (NRV)","S: lower = 2,900 (cost)","Total = 13,200 + 9,350 + 6,050 + 2,900 = £31,500"],
  exp:"Compare cost and NRV for EACH item; never net gains against losses."},
 {t:6,q:"Goods cost £12,000 and are now expected to sell for only £9,000. At what amount are they carried?",o:[
  ["£9,000","Correct. Lower of cost and NRV."],
  ["£12,000","That overstates the asset."],
  ["£3,000","That is the loss, not the carrying amount."],
  ["£21,000","You added cost and NRV."]],
  exp:"Prudence: when the expected selling price falls below cost, write down to NRV now."},
 {t:6,sub:"Calculation",q:"Insurance of £5,400 is paid on 1 August for 12 months. The year end is 31 December. What is the prepayment?",o:[
  ["£3,150","Correct. 7 months unused."],
  ["£2,250","That is the 5 months used (the expense)."],
  ["£2,700","You assumed 6 months unused."],
  ["£5,400","That is the whole payment."]],
  steps:["Monthly = 5,400 ÷ 12 = £450","Used Aug–Dec = 5 months = £2,250","Unused Jan–Jul = 7 months = 7 × 450 = £3,150"],
  exp:"Count the months carefully: August to December inclusive is 5 months."},
 {t:6,q:"Which is an 'other debtor' rather than a trade receivable?",o:[
  ["A tax refund due to the business","Correct. It does not arise from sales."],
  ["A customer's unpaid sales invoice","That is a trade receivable."],
  ["Rent paid in advance","That is a prepayment."],
  ["An unpaid supplier invoice","That is a payable (liability)."]],
  exp:"Trade receivables come from credit sales. Other debtors include loans to employees or other businesses and tax refunds."},
 {t:6,q:"A customer owing £2,600 has been declared bankrupt. The debt should be:",o:[
  ["Written off as a bad debt","Correct. It is known that the customer will not pay."],
  ["Added to the provision for doubtful debts only","A provision is for debts that MIGHT not be paid; this one definitely won't."],
  ["Left in receivables until the end of the bankruptcy","That would overstate assets, against prudence."],
  ["Accrued as a current liability","Accruals are unpaid expenses, not lost receivables."]],
  exp:"Bad debt = known loss, written off. Doubtful debt = risk, covered by a provision."},
 {t:6,q:"Shares bought as a short-term investment for £10,000 have a fair value of £9,200 at the year end. How are they reported?",o:[
  ["At £9,200, with an £800 loss in the income statement","Correct. Current investments are marked to market through the income statement."],
  ["At £10,000, with no entry until they are sold","Current investments are measured at fair value."],
  ["At £9,200, with £800 taken to the revaluation reserve","That treatment is for revalued land and buildings, not current investments."],
  ["At £10,000, with the fall disclosed only in the notes","The change must go through the income statement."]],
  exp:"Fair value is more relevant for investments that can be sold easily."},
 {t:6,sub:"Calculation",q:"Total assets less current liabilities are £384,560 and non-current liabilities are £95,000. What are net assets?",o:[
  ["£289,560","Correct."],
  ["£479,560","You added the non-current liabilities."],
  ["£384,560","You ignored the non-current liabilities."],
  ["£95,000","That is only the loan."]],
  steps:["Net assets = TALCL − NCL = 384,560 − 95,000 = £289,560"],
  exp:"Net assets = capital."},
 {t:6,sub:"Calculation",q:"A sole trader's opening capital is £148,300. During the year she introduces £5,000, makes a profit of £41,750 and draws £26,480. What capital is shown in the SOFP?",o:[
  ["£168,570","Correct."],
  ["£163,570","You left out the capital introduced."],
  ["£195,050","You ignored drawings."],
  ["£221,530","You added drawings."]],
  steps:["148,300 + 5,000 + 41,750 = £195,050","Less drawings 26,480 → £168,570"],
  exp:"Capital = opening + introduced + profit − drawings, and it must equal net assets."},
 {t:6,sub:"Calculation",q:"A plc's opening retained earnings are £136,420 and profit for the year is £28,915. A dividend of £7,500 was PAID during the year and a further £4,000 is PROPOSED but not recognised. What are closing retained earnings?",o:[
  ["£157,835","Correct."],
  ["£153,835","You also deducted the proposed dividend, which is not recognised."],
  ["£165,335","You ignored the dividend actually paid."],
  ["£161,335","You deducted the proposed dividend instead of the paid one."]],
  steps:["136,420 + 28,915 = £165,335","Less dividend paid 7,500 = £157,835","Proposed £4,000 is not recognised (no deduction)"],
  exp:"As in Smith Plc, a proposed dividend is not recorded as owed."},
 {t:6,q:"A business has current assets very much greater than its current liabilities. The main concern is that:",o:[
  ["Finance is tied up that could be used to expand non-current assets","Correct."],
  ["It may be unable to pay its debts","That is the risk of LOW working capital."],
  ["Its inventory must be overvalued","Nothing suggests that."],
  ["Its drawings are too high","Not related."]],
  exp:"Balance is key: too low = payment risk; too high = idle money."},
 {t:6,q:"Why is work in progress riskier than finished goods?",o:[
  ["It carries non-completion risk on top of the usual risks","Correct."],
  ["It is always worth less than cost","Not always."],
  ["It is a liability until finished","It is an asset."],
  ["It cannot be measured at all","It is measured at the cost of work done, checked carefully by managers."]],
  exp:"WIP might never be finished, so it has an extra layer of risk."},
 {t:6,q:"How is a business's cash at bank verified?",o:[
  ["By the bank statement","Correct."],
  ["By its sales invoices","Invoices do not confirm a bank balance."],
  ["By management estimate","Cash is never estimated."],
  ["By the trial balance","A trial balance only lists the ledger balance; it does not verify it."]],
  exp:"Cash is the most certain current asset: count it or check the bank statement."},
 {t:6,q:"In the working capital cycle, what is the next step after goods are sold on credit?",o:[
  ["Receivables are collected as cash","Correct."],
  ["Inventory is bought","That is the first step, before the sale."],
  ["Payables become receivables","Payables are what the business owes; they never become receivables."],
  ["Cash is turned into inventory","That happens before the sale."]],
  exp:"Inventory → receivables → cash → pay suppliers (and round again)."},
 {t:6,q:"Electricity for December of £450 has not been recorded at the year end. What is the effect of correcting it?",o:[
  ["Expenses ↑ £450 and a current liability (accrual) of £450","Correct."],
  ["Expenses ↓ £450 and a current asset of £450","That would be a prepayment."],
  ["No effect until the bill is paid","That is the cash basis."],
  ["Drawings ↑ £450","It is a business cost, not a private one."]],
  exp:"Accruals increase expenses and create a current liability."},
 {t:6,q:"Why might recognising a current asset be questioned?",o:[
  ["Doubt about the expected benefit or about reliable measurement","Correct."],
  ["It is too large","Size alone is not the issue."],
  ["It is also a liability","An item cannot be both."],
  ["It was free","Cost is not the test; benefit and measurement are."]],
  exp:"Recognition needs the definition met and useful, faithful information. Cash is the most certain; WIP and doubtful debts are less certain."}
];

 "Both A and R are true, but R does NOT explain A",

 "A is false, but R is true",
 "Both A and R are false"
];

// --- build pools of normalised question objects ---
function arTruth(a){ return [[1,1,1],[1,1,0],[1,0,0],[0,1,0],[0,0,0]][a]; }
function build(){
  const P = {tf:[], match:[], mcq:[], adv:[]};
  TF.forEach((x,i)=>P.tf.push({uid:"tf"+i, kind:"tf", t:x.t, sub:"True / False", q:x.q, a:x.a, exp:x.exp, trap:x.trap}));
  MATCH.forEach((x,i)=>P.match.push({uid:"m"+i, kind:"match", t:x.t, sub:"Matching", q:x.q, pairs:x.pairs, extra:x.extra||[], exp:x.exp}));
  MCQ.forEach((x,i)=>P.mcq.push({uid:"q"+i, kind:"single", t:x.t, sub:x.sub||"Multiple choice", q:x.q, o:x.o, fixed:false, steps:x.steps, exp:x.exp}));
  MULTI.forEach((x,i)=>P.adv.push({uid:"ms"+i, kind:"multi", t:x.t, sub:"Select all that apply", q:x.q, o:x.o, exp:x.exp}));
  AR.forEach((x,i)=>{
    const tr = arTruth(x.a);
    const desc = (tr[0]?"A is TRUE":"A is FALSE") + ", " + (tr[1]?"R is TRUE":"R is FALSE") + (tr[0]&&tr[1] ? (tr[2]?", and R explains A.":", but R does not explain A.") : ".");
    const o = AR_OPTS.map((txt,k)=>{
      if (k===x.a) return [txt,"Correct. "+desc];
      const w = arTruth(k);
      let why = "This option claims " + (w[0]?"A is true":"A is false") + " and " + (w[1]?"R is true":"R is false") + (w[0]&&w[1]?(w[2]?" with R explaining A":" with R not explaining A"):"") + ". Actually: " + desc;
      return [txt, why];
    });
    // reorder so the correct one is first (engine convention) but keep display order fixed
    P.adv.push({uid:"ar"+i, kind:"single", t:x.t, sub:"Assertion–reason", ar:{A:x.A,R:x.R}, q:"Assertion (A): "+x.A+"  Reason (R): "+x.R, o:o, correctIdx:x.a, fixed:true, exp:x.exp});
  });
  ADV.forEach((x,i)=>P.adv.push({uid:"ad"+i, kind:"single", t:x.t, sub:x.sub, q:x.q, o:x.o, fixed:false, steps:x.steps, exp:x.exp}));
  return P;
}

// prepare an instance (shuffle options) for a session
function prep(q){
  const p = Object.assign({}, q);
  if (q.kind === "single"){
    let opts = q.o.map((x,k)=>({text:x[0], why:x[1], correct: q.fixed ? k===q.correctIdx : k===0}));
    p.opts = q.fixed ? opts : shuffle(opts);
  } else if (q.kind === "multi"){
    p.opts = shuffle(q.o.map(x=>({text:x[0], correct:x[1], why:x[2]})));
  } else if (q.kind === "tf"){
    p.opts = [{text:"True", correct:q.a===true}, {text:"False", correct:q.a===false}];
  } else if (q.kind === "match"){
    p.rows = shuffle(q.pairs.map(x=>({left:x[0], answer:x[1]})));
    const set = Array.from(new Set(q.pairs.map(x=>x[1]).concat(q.extra||[])));
    p.choices = shuffle(set);
  }
  return p;
}

// stratified pick: at least `minPer` per selected topic where possible
function pick(pool, n, topics, minPer){
  pool = pool.filter(q=>topics.includes(q.t));
  if (n >= pool.length) return shuffle(pool);
  const chosen = [], used = new Set();
  if (minPer){
    topics.forEach(t=>{
      shuffle(pool.filter(q=>q.t===t)).slice(0,minPer).forEach(q=>{ if (chosen.length<n){chosen.push(q); used.add(q.uid);} });
    });
  }
  shuffle(pool.filter(q=>!used.has(q.uid))).forEach(q=>{ if (chosen.length<n) chosen.push(q); });
  return shuffle(chosen);
}
